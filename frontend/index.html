<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Game Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🎮 Video Game Vault</h1>
      <p>Manage your collection via Flask REST API</p>
    </header>

    <div id="alert-box" class="alert hidden"></div>

    <div class="content-grid">
      <section class="card form-card">
        <h2 id="form-title">Add New Game</h2>
        <form id="game-form">
          <input type="hidden" id="game-id" />

          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" placeholder="e.g., Elden Ring" required />
          </div>

          <div class="form-group">
            <label for="genre">Genre *</label>
            <input type="text" id="genre" placeholder="e.g., Action RPG" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="release_year">Release Year *</label>
              <input type="number" id="release_year" placeholder="2022" required />
            </div>

            <div class="form-group">
              <label for="rating">Rating (0-10) *</label>
              <input type="number" step="0.1" id="rating" placeholder="9.5" required />
            </div>
          </div>

          <div class="form-group">
            <label for="platform">Platform *</label>
            <input type="text" id="platform" placeholder="e.g., PC / PS5" required />
          </div>

          <div class="button-group">
            <button type="submit" id="submit-btn" class="btn btn-primary">Save Game</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden" onclick="resetForm()">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>Game Library</h2>
          <button onclick="fetchGames()" class="btn btn-small">↻ Refresh</button>
        </div>

        <div id="loading" class="loading-spinner hidden">
          <div class="spinner"></div>
          <p>Loading games from API...</p>
        </div>

        <div id="detail-view" class="detail-box hidden">
          <div class="detail-content">
            <h3 id="detail-title"></h3>
            <p><strong>Genre:</strong> <span id="detail-genre"></span></p>
            <p><strong>Year:</strong> <span id="detail-year"></span></p>
            <p><strong>Platform:</strong> <span id="detail-platform"></span></p>
            <p><strong>Rating:</strong> ⭐ <span id="detail-rating"></span>/10</p>
            <button onclick="closeDetailView()" class="btn btn-small btn-secondary">Close View</button>
          </div>
        </div>

        <div id="games-container" class="games-grid"></div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
